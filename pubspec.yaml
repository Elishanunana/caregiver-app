name: caregiver_app
description: "KNUST COE 497 — Caregiver companion application for the Resilient, Offline-First Assistive Ecosystem for Geriatric Care."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # ── State management ────────────────────────────────────────────
  provider: ^6.1.2

  # ── Local persistence (Hive) ────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: 2.1.4

  # ── Networking ─────────────────────────────────────────────────
  http: ^1.2.2

  # ── Secure storage for credentials ─────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── External-app dispatch ──────────────────────────────────────
  # Used to open the device's SMS composer with the hub's destination
  # number and HMAC-signed payload pre-filled. The caregiver confirms
  # transmission with one tap. This is the "remote SMS pathway" of the
  # hybrid sync architecture (Section 3.5.4 of the project report).
  url_launcher: ^6.3.1

  # ── Crypto (HMAC-SHA256 for SMS payload signing) ───────────────
  crypto: ^3.0.3

  # ── Utilities ──────────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.5.0

  cupertino_icons: ^1.0.8

dependency_overrides:
  path_provider_android: 2.2.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.13
  hive_generator: ^2.0.1

  # Mocking for HubApiClient tests.
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  