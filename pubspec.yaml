name: caregiver_app
description: "KNUST COE 497 — Caregiver companion application for the Resilient, Offline-First Assistive Ecosystem for Geriatric Care."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # ── State management ────────────────────────────────────────────
  provider: ^6.1.2

  # ── Local persistence (Hive) ────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: 2.1.4         # CHANGED: pinned to non-JNI version

  # ── Utilities ──────────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.5.0

  cupertino_icons: ^1.0.8

# NEW SECTION — forces the Android implementation back to a stable, non-JNI version
dependency_overrides:
  path_provider_android: 2.2.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # ── Hive code generation ────────────────────────────────────────
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  